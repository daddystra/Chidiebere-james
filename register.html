<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FORMA | Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #171312;
            color: #f8f3ee;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        /* IMAGE SIDE */

        .visual {
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 50px;
            background:
                linear-gradient(
                    0deg,
                    rgba(0,0,0,.8),
                    rgba(0,0,0,.1)
                ),
                url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1400&q=85")
                center/cover;
        }

        .brand {
            position: absolute;
            top: 35px;
            left: 40px;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        .brand span {
            display: block;
            font-size: 10px;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        .visual h1 {
            font-size: clamp(40px, 5vw, 70px);
            font-weight: 300;
            line-height: 1;
            margin-bottom: 20px;
        }

        .visual p {
            color: #ddd;
            font-size: 14px;
            line-height: 1.8;
        }

        /* REGISTRATION */

        .register-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px;
        }

        .register-box {
            width: 100%;
            max-width: 390px;
        }

        .back {
            display: inline-block;
            margin-bottom: 35px;
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
        }

        .eyebrow {
            color: #d99a76;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 34px;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #999;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #ddd;
            font-size: 12px;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #191a1c;
            color: white;
            border: 1px solid #393a3c;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #c0a27a;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 65px;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #c0a27a;
            cursor: pointer;
            font-size: 11px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            color: #aaa;
            font-size: 11px;
            line-height: 1.7;
        }

        .terms input {
            width: 15px;
            height: 15px;
            margin-top: 3px;
            accent-color: #c0a27a;
            flex-shrink: 0;
        }

        .terms a {
            color: #d99a76;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            background: #d99a76;
            color: #1d1715;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: .3s;
        }

        .submit-btn:hover {
            background: #e8b095;
        }

        #message {
            color: #f2c0a2;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 15px;
        }

        .signin {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 25px;
        }

        .signin a {
            color: #c0a27a;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 10px;
            border-top: 1px solid #292a2c;
            padding-top: 20px;
            margin-top: 30px;
        }

        /* MOBILE */

        @media(max-width: 800px) {
            .page {
                grid-template-columns: 1fr;
            }

            .visual {
                min-height: 230px;
                padding: 25px;
            }

            .brand {
                top: 20px;
                left: 25px;
            }

            .visual h1 {
                font-size: 36px;
            }

            .visual p {
                font-size: 12px;
            }

            .register-area {
                padding: 35px 25px;
            }

            h2 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- LEFT SIDE -->

    <section class="visual">

        <div class="brand">
            FORMA
            <span>ARCHITECTS</span>
        </div>

        <div>
            <h1>YOUR SPACE.<br>YOUR STORY.</h1>

            <p>
                Discover architecture.<br>
                Create something timeless.
            </p>
        </div>

    </section>

    <!-- RIGHT SIDE -->

    <main class="register-area">

        <div class="register-box">

            <a href="index.html" class="back">
                ← Back to website
            </a>

            <div class="eyebrow">
                FORMA ARCHITECTS
            </div>

            <h2>Create account.</h2>

            <p class="subtitle">
                Join our studio community
                and explore our projects.
            </p>

            <form id="registerForm">

                <div class="field">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your full name"
                        autocomplete="name"
                        maxlength="100"
                        required>
                </div>

                <div class="field">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="At least 12 characters"
                            autocomplete="new-password"
                            minlength="12"
                            maxlength="128"
                            required>

                        <button
                            type="button"
                            class="toggle"
                            id="togglePassword">
                            SHOW
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter password again"
                        autocomplete="new-password"
                        minlength="12"
                        maxlength="128"
                        required>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>

                    <span>
                        I agree to the website's
                        <a href="mailto:hello@example.com?subject=Terms%20Request">
                            terms and conditions
                        </a>.
                    </span>
                </label>

                <button
                    type="submit"
                    class="submit-btn">
                    CREATE ACCOUNT →
                </button>

                <p id="message" role="status"></p>

            </form>

            <p class="signin">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

            <div class="footer">
                © 2026 FORMA ARCHITECTS
            </div>

        </div>

    </main>

</div>

<script>
  const registerForm = document.querySelector("form");

if (registerForm) {
  registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name =
      registerForm.querySelector('[name="name"]')?.value.trim();

    const email =
      registerForm.querySelector('[name="email"]')?.value.trim();

    const password =
      registerForm.querySelector('[name="password"]')?.value;

    const confirmPassword =
      registerForm.querySelector('[name="confirmPassword"]')?.value;

    if (!name || !email || !password) {
      alert("Please complete all required fields.");
      return;
    }

    if (password !== confirmPassword) {
      alert("Your passwords do not match.");
      return;
    }

    const submitButton = registerForm.querySelector(
      'button[type="submit"], input[type="submit"]'
    );

    if (submitButton) {
      submitButton.disabled = true;
    }

    try {
      const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify({ name, email, password })
      });

      const result = await response.json();

      if (!response.ok) {
        alert(result.message || result.error || "Registration failed.");
        return;
      }

      alert("Account created successfully! You can now log in.");
      window.location.href = "login.html";
    } catch (error) {
      alert(
        "Could not connect to the server. Make sure the website is running through Node.js."
      );
    } finally {
      if (submitButton) {
        submitButton.disabled = false;
      }
    }
  });
}
</script>

</body>
</html>
